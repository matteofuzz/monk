  postgres:
    image: postgres:16
    env_file: .env.production # POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB
    volumes: [pgdata:/var/lib/postgresql/data]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      retries: 30
