
# Tuned to the style the codebase already has (double quotes, trailing commas
# in multiline literals, no frozen-string-literal magic comment, prose-heavy
# comments instead of class docs), so a run flags real problems rather than
# demanding a mass reformat. Run: bundle exec rubocop
AllCops:
  TargetRubyVersion: 4.0
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "log/**/*"
    - "vendor/**/*"
    - "lib/monk/templates/**/*"

Style/StringLiterals:
  EnforcedStyle: double_quotes
Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes
Style/TrailingCommaInArguments:
  EnforcedStyleForMultiline: consistent_comma
Style/TrailingCommaInHashLiteral:
  EnforcedStyleForMultiline: consistent_comma
Style/TrailingCommaInArrayLiteral:
  EnforcedStyleForMultiline: consistent_comma
Style/FrozenStringLiteralComment:
  Enabled: false
Style/Documentation:
  Enabled: false
Layout/LineLength:
  Max: 120
Metrics:
  Enabled: false
Gemspec/DevelopmentDependencies:
  Enabled: false
Gemspec/RequireMFA:
  Enabled: false
# The house style indents continuation lines by two, e.g.
#   raise Monk::Foo,
#     "message"
Layout/ArgumentAlignment:
  EnforcedStyle: with_fixed_indentation
Layout/FirstArrayElementIndentation:
  EnforcedStyle: consistent
Layout/FirstHashElementIndentation:
  EnforcedStyle: consistent

# Short names that read better than long ones where they're used: an
# operation (op), a byte count (n), a QR code (qr), and the generator
# DSL's if: keyword.
Naming/MethodParameterName:
  AllowedNames: [at, by, db, id, if, in, io, ip, of, on, os, pp, to, op, n, qr]
# revoke returns whether a session was revoked; it's public API.
Naming/PredicateMethod:
  AllowedMethods: [revoke]
# Test names carry HTTP status codes and RFC numbers (..._304, ..._401).
Naming/VariableNumber:
  Exclude:
    - "test/**/*"
# Route blocks in tests read as routes: get("/me") { |ctx| ctx.require_user! }.
Style/SymbolProc:
  AllowedMethods: [get, post, put, patch, delete, new]
# A bin/ script is one file on purpose, its helper classes included.
Style/OneClassPerFile:
  inherit_mode:
    merge: [Exclude]
  Exclude:
    - "bin/**/*"
